<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Clinic System{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --accent: #14b8a6;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      margin: 0;
    }
    .navbar-custom {
      background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 100%);
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
      padding: 1rem 0;
    }
    .navbar-custom .navbar-brand {
      color: #fff;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }
    .navbar-custom .nav-btn {
      color: #fff;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      margin-left: 0.5rem;
      transition: all 0.2s;
    }
    .navbar-custom .nav-btn:hover {
      background: rgba(255,255,255,0.28);
      color: #fff;
      transform: translateY(-1px);
    }
    .navbar-custom .nav-btn.active {
      background: #fff;
      color: var(--primary-dark);
    }

    .page-header {
      background: linear-gradient(135deg, #0ea5e9 0%, #14b8a6 100%);
      color: #fff;
      padding: 2.5rem 0 4rem;
      margin-bottom: -3rem;
    }
    .page-header h1 {
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .page-header p { opacity: 0.9; margin: 0.25rem 0 0; }

    .card-modern {
      background: var(--card);
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .card-modern .card-header {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 1.25rem 1.5rem;
      font-weight: 600;
    }

    .stat-card {
      background: var(--card);
      border-radius: 14px;
      padding: 1.25rem;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff;
    }
    .stat-icon.blue { background: linear-gradient(135deg, #0ea5e9, #0284c7); }
    .stat-icon.teal { background: linear-gradient(135deg, #14b8a6, #0d9488); }
    .stat-icon.amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1; }
    .stat-label { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; }

    .table-modern {
      width: 100%; margin: 0;
    }
    .table-modern thead th {
      background: #f8fafc;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.9rem 1.25rem;
      border: none;
    }
    .table-modern tbody td {
      padding: 1rem 1.25rem;
      vertical-align: middle;
      border-top: 1px solid #f1f5f9;
    }
    .table-modern tbody tr:hover { background: #f8fafc; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #14b8a6);
      color: #fff;
      display: inline-flex;
      align-items: center; justify-content: center;
      font-weight: 600; font-size: 0.85rem;
      margin-right: 0.65rem;
    }

    .btn-primary-modern {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      border: none;
      color: #fff;
      padding: 0.6rem 1.25rem;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
      transition: all 0.2s;
    }
    .btn-primary-modern:hover {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(14, 165, 233, 0.4);
    }
    .btn-icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #fff;
      display: inline-flex;
      align-items: center; justify-content: center;
      color: var(--muted);
      transition: all 0.15s;
    }
    .btn-icon:hover { background: #f1f5f9; color: var(--text); }
    .btn-icon.danger:hover { background: #fee2e2; color: var(--danger); border-color: #fecaca; }

    .badge-status {
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-status.scheduled { background: #dbeafe; color: #1e40af; }
    .badge-status.completed { background: #dcfce7; color: #166534; }
    .badge-status.cancelled { background: #fee2e2; color: #991b1b; }

    .form-modern .form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
      margin-bottom: 0.4rem;
    }
    .form-modern .form-control,
    .form-modern .form-select {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: all 0.15s;
    }
    .form-modern .form-control:focus,
    .form-modern .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-state i { font-size: 3rem; opacity: 0.4; display: block; margin-bottom: 0.5rem; }

    /* Sticky-footer layout: body becomes a flex column so the footer
       sits at the bottom of the viewport even on short pages (login). */
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    main.container { flex: 1 0 auto; }
    footer.app-footer {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 1rem 0;
      margin-top: 3rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .host-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #f1f5f9;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 0.8rem;
      color: var(--text);
    }
    .host-pill .dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
<nav class="navbar-custom">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="/">
      <i class="bi bi-heart-pulse-fill me-2"></i>MediCare Clinic
    </a>
    <div>
      <a class="nav-btn {% if request.endpoint in ['list_patients','new_patient','edit_patient'] %}active{% endif %}" href="/patients">
        <i class="bi bi-people-fill me-1"></i> Patients
      </a>
      <a class="nav-btn {% if request.endpoint == 'appointments' %}active{% endif %}" href="/appointments">
        <i class="bi bi-calendar-event-fill me-1"></i> Appointments
      </a>
      <a class="nav-btn {% if request.endpoint in ['list_records','new_record','edit_record'] %}active{% endif %}" href="/records">
        <i class="bi bi-journal-medical me-1"></i> Records
      </a>
      <a class="nav-btn {% if request.endpoint in ['list_medicines','new_medicine','edit_medicine'] %}active{% endif %}" href="/medicines">
        <i class="bi bi-capsule me-1"></i> Medicines
      </a>
      {% if current_user.is_authenticated %}
      <span class="nav-btn" style="background:rgba(255,255,255,0.1); cursor:default;">
        <i class="bi bi-person-circle me-1"></i> {{ current_user.username }}
      </span>
      <a class="nav-btn" href="{{ url_for('logout') }}" title="Sign out">
        <i class="bi bi-box-arrow-right me-1"></i> Logout
      </a>
      {% endif %}
    </div>
  </div>
</nav>

{% block header %}{% endblock %}

<main class="container" style="padding-bottom: 2rem;">
  {% block content %}{% endblock %}
</main>

<footer class="app-footer">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <div>
      <i class="bi bi-shield-check text-success"></i>
      Fault-tolerant distributed system &middot; AWS Multi-AZ
    </div>
    <div>
      Served by <span class="host-pill"><span class="dot"></span>{{ host }}</span>
    </div>
  </div>
</footer>
</body>
</html>
